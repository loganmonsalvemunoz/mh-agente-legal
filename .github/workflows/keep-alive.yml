name: Keep Render awake

# El plan gratis de Render "duerme" el servicio tras 15 minutos sin trafico. Este workflow
# le hace una peticion liviana cada 10 minutos para que nunca llegue a dormirse — sin costo
# (los minutos de GitHub Actions de este uso son minimos) y sin depender de un servicio externo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping widget
        run: |
          curl -s -o /dev/null -w "Estado: %{http_code}\n" https://mh-agente-legal-widget.onrender.com/widget/widget.js
