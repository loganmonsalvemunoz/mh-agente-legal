services:
  - type: web
    name: mh-agente-legal-widget
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Panel admin encendido (leads del chat). Bot de WhatsApp de pedidos APAGADO a proposito:
      # los Cursos para Dummies todavia no estan disponibles. Para reactivarlo, pon
      # WHATSAPP_ENABLED en "true", sube el cambio y vuelve a escanear el QR en /admin.
      - key: ADMIN_ENABLED
        value: "true"
      - key: WHATSAPP_ENABLED
        value: "false"
      # Segundo bot de WhatsApp (consultas generales) — sigue apagado, todavia no hay numero
      # dedicado para el (ver whatsappGeneral.js).
      - key: WHATSAPP_GENERAL_ENABLED
        value: "false"
      - key: ADMIN_USER
        value: "admin"
      # Hash de una contrasena de prueba generada para este periodo — el valor en claro se
      # entrego aparte (nunca se guarda en texto plano en el repo). Cambiala cuando quieras
      # con: npm run hash-password -- "tu-clave-nueva"
      - key: ADMIN_PASSWORD_HASH
        value: "$2a$10$raCpk5s0TEazaWoqkLM..OR9ZIjC1w0uu.9ht1XAlU2qNdKbd7kM2"
      - key: SESSION_SECRET
        generateValue: true
      # Cambia esto al dominio real cuando lo embebas en WordPress.
      - key: WIDGET_ALLOWED_ORIGIN
        value: "https://mhgrupoempresarial.com"
      - key: LOG_LEVEL
        value: warn
